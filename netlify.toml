[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build]
  publish = "out"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "18"

# Configurar las variables de entorno en la UI de Netlify:
# NEXT_PUBLIC_WS_URL=wss://tu-backend.com/ws
# NEXT_PUBLIC_API_URL=https://tu-backend.com
