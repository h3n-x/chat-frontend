<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Crypto API</title>
</head>
<body>
    <h1>Test Web Crypto API</h1>
    <div id="results"></div>
    
    <script>
        async function testCrypto() {
            const results = document.getElementById('results');
            
            // Test básico de disponibilidad
            results.innerHTML += '<h2>Verificaciones básicas:</h2>';
            results.innerHTML += `<p>crypto disponible: ${typeof crypto !== 'undefined'}</p>`;
            results.innerHTML += `<p>crypto.subtle disponible: ${typeof crypto?.subtle !== 'undefined'}</p>`;
            results.innerHTML += `<p>isSecureContext: ${window.isSecureContext}</p>`;
            results.innerHTML += `<p>protocol: ${window.location.protocol}</p>`;
            results.innerHTML += `<p>hostname: ${window.location.hostname}</p>`;
            
            if (typeof crypto === 'undefined' || !crypto.subtle) {
                results.innerHTML += '<p style="color: red;">❌ Web Crypto API no disponible</p>';
                return;
            }
            
            try {
                // Test de generación de clave
                results.innerHTML += '<h2>Test de generación de clave:</h2>';
                const key = await crypto.subtle.generateKey(
                    {
                        name: 'AES-GCM',
                        length: 256,
                    },
                    true,
                    ['encrypt', 'decrypt']
                );
                results.innerHTML += '<p style="color: green;">✅ Clave AES-256 generada correctamente</p>';
                
                // Test de cifrado/descifrado
                results.innerHTML += '<h2>Test de cifrado/descifrado:</h2>';
                const message = "¡Hola, este es un mensaje de prueba!";
                const encoder = new TextEncoder();
                const decoder = new TextDecoder();
                const iv = crypto.getRandomValues(new Uint8Array(12));
                
                // Cifrar
                const encryptedBuffer = await crypto.subtle.encrypt(
                    {
                        name: 'AES-GCM',
                        iv: iv,
                    },
                    key,
                    encoder.encode(message)
                );
                results.innerHTML += '<p style="color: green;">✅ Mensaje cifrado correctamente</p>';
                
                // Descifrar
                const decryptedBuffer = await crypto.subtle.decrypt(
                    {
                        name: 'AES-GCM',
                        iv: iv,
                    },
                    key,
                    encryptedBuffer
                );
                const decryptedMessage = decoder.decode(decryptedBuffer);
                
                if (decryptedMessage === message) {
                    results.innerHTML += '<p style="color: green;">✅ Mensaje descifrado correctamente</p>';
                    results.innerHTML += `<p>Mensaje original: "${message}"</p>`;
                    results.innerHTML += `<p>Mensaje descifrado: "${decryptedMessage}"</p>`;
                } else {
                    results.innerHTML += '<p style="color: red;">❌ Error: mensaje descifrado no coincide</p>';
                }
                
                results.innerHTML += '<h2>Conclusión:</h2>';
                results.innerHTML += '<p style="color: green; font-weight: bold;">🎉 Web Crypto API funciona perfectamente en este contexto</p>';
                
            } catch (error) {
                results.innerHTML += `<p style="color: red;">❌ Error durante las pruebas: ${error.message}</p>`;
                console.error('Error en test crypto:', error);
            }
        }
        
        // Ejecutar test al cargar la página
        testCrypto();
    </script>
</body>
</html>
